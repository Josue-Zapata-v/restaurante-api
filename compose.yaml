name: restaurante-api
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: restaurante
      POSTGRES_USER: restaurante
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta scripts/Preparar-Local.ps1 para generar la clave local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/restaurante.sql:/docker-entrypoint-initdb.d/01-restaurante.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurante -d restaurante"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
